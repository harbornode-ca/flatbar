[package]
name = "flatbar-core"
version = "0.1.0"
edition = "2021"
description = "Core library for the flatbar Wayland status bar"

[dependencies]
smithay-client-toolkit = { version = "0.21.1", features = ["calloop", "calloop-wayland-source", "bytemuck"] }
cosmic-text = "0.19"
calloop = { version = "0.14", features = ["signals"] }
calloop-wayland-source = "0.4"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc = "0.2"
bytemuck = "1.25"
image = "0.25"
zbus = { version = "5.19.0", features = ["blocking-api"] }
freedesktop-icons = "0.4.0"
resvg = "0.48.1"

[dev-dependencies]
tempfile = "3"
